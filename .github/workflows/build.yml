name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B clean verify
      - name: Generate API documentation and diagrams
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz plantuml
          doxygen Doxyfile
          plantuml -tsvg docs/diagrams/*.puml
      - uses: actions/upload-artifact@v4
        with:
          name: untitled-bomberman-game
          path: launcher/target/launcher-0.1.0-SNAPSHOT.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-docs
          path: |
            launcher/target/surefire-reports/
            launcher/target/site/jacoco-aggregate/
            launcher/target/doxygen/html/
            docs/diagrams/*.svg
